name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # получаем готовый репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # устанавливаем node.js
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # запускаем проверки
      - name: Run checks
        run: npm run check

      # проверяем production-сборку
      - name: Build application
        run: npm run build